# Shift-left: catch secrets and obvious issues on the developer's machine
# before they ever reach Git. Install with:  pip install pre-commit && pre-commit install
# Run `pre-commit autoupdate` to move to the latest tool versions.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-r", "app", "-ll"]
