# Example of a custom, organisation-specific Semgrep rule.
# Talking point: "I wrote custom rules for patterns our team kept repeating."
rules:
  - id: requests-tls-verify-disabled
    languages: [python]
    severity: ERROR
    message: >
      TLS certificate verification is disabled (verify=False). This allows
      man-in-the-middle attacks. Remove verify=False or pass a CA bundle path.
    pattern-either:
      - pattern: requests.$METHOD(..., verify=False, ...)
      - pattern: requests.request(..., verify=False, ...)
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A02:2021 - Cryptographic Failures"

  - id: flask-debug-enabled
    languages: [python]
    severity: WARNING
    message: Flask debug mode exposes an interactive debugger (remote code execution). Never enable in production.
    pattern: $APP.run(..., debug=True, ...)
    metadata:
      cwe: "CWE-489: Active Debug Code"
